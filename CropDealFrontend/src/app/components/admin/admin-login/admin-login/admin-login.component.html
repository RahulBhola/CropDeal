<div class="body">
    <div class="container">
        <div class="login-box">
            <h2>Login</h2>
            <form [formGroup]="adminLogin" (ngSubmit)="onAdminLogin()" >
                <!--Email-->
                <div class="input-box">
                    <input type="email" required formControlName="email">
                    <label>Email</label>
                </div>
                <div class="error-feedback" *ngIf="hasDisplayableLoginError('email')" >
                    <div *ngIf="adminLogin.controls['email'].hasError('required')" >
                        Email is required.
                    </div>
                    <div *ngIf="adminLogin.controls['email'].hasError('pattern')" >
                        Invalid email format.
                    </div>
                </div>
                <div class="input-box">
                    <input type="password" required formControlName="password">
                    <label>Password</label>
                </div>
                <div class="error-feedback" *ngIf="hasDisplayableLoginError('password')" >
                    <div *ngIf="adminLogin.controls['password'].hasError('required')" >
                        Password is required.
                    </div>
                    <div *ngIf="adminLogin.controls['password'].hasError('pattern')" >
                        Password must be at least one uppercase letter, one lowercase letter, one digit, and one special character.
                    </div>
                </div>
                <!-- <div class="forgot-pass">
                    <a href="#">Forgot your password?</a>
                </div> -->
                <button type="submit" class="btn">Login</button>
            </form>
        </div>
