<div style="background-color: wheat;">
    <div style="background: radial-gradient(circle at center,rgba(39, 75, 21, 0.95) 0%, rgba(99, 121, 55, 0.85) 50%, rgba(108, 189, 53, 0.8) 100%); height: 220px; border-radius: 0 0 50px 50px;">
      <div class="text-center pt-5 text-white">
        <h4>Approve / Reject Crop</h4>
        <h1 class="fw-bold" style="font-family: 'Roboto Slab', serif;">Crop Management</h1>
      </div>
    </div>
    <div class="py-5" style="margin: 0 190px;">
      <div *ngIf="crops.length > 0; else noCrops">
        <div *ngFor="let crop of crops" class="d-flex justify-content-between align-items-center mb-4" style="border-radius: 50px; padding: 25px 50px; background: rgba(255, 255, 255, 0.9); box-shadow: inset -5px 5px 7px rgba(0, 0, 0, 0.9);">
          <!-- Image -->
          <img class="me-3 image" [src]="'data:image/jpeg;base64,' + crop.imageData" alt="Crop Image"  />
          <!-- Content -->
          <div style="color: #2e4829;">
            <h2 class="text-uppercase" style="color: #1b5e20; margin-bottom: 10px;">{{ crop.cropName }}</h2>
            <div style="color: #455a64;">{{ crop.description }}</div>
            <div style="color: #455a64; margin-top: 5px;">Quantity: {{ crop.availableQuantity }}</div>
  
            <!-- <div style="color: #455a64;">Type: {{ crop.type }}</div> -->
          </div>
          <!-- Price -->
          <div class="text-end" style="width: 450px;">
            <div class="fw-bold" style="font-size: 25px; color: #2e7d32;">₹{{ crop.pricePerKg }} / Kg</div>
            <!-- Edit and Delete Buttons -->
            <div class="mt-2 d-flex justify-content-end">
                <div class="text-white fw-bold" style="background-color: red; padding: 8px 12px ; cursor: pointer; margin-right: 5px;" (click)="onApproveCrop(crop)">Approve</div>
                <div class="text-white fw-bold" style="background-color: black; padding: 8px 12px ; cursor: pointer;" (click)="onRejectCrop(crop)">Reject</div>
            </div>
          </div>
        </div>
      </div>
      <!-- No Crops Message -->
      <ng-template #noCrops>
        <div class="text-center">
          <h3 class="text-center fw-bold my-4" style="font-size: 35px;">Waiting for Farmers to add crop for approval.</h3>
        </div>
      </ng-template>
    </div>
</div>
