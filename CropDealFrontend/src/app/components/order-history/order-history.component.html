<div style="background: linear-gradient(to right, rgba(0, 128, 0, 0.7), rgba(0, 128, 0, 0.2));">
    <div class="py-5" style="margin: 0 190px;">
        <h1 class="mb-4">Order History</h1>
    
        <div class="row gy-3">
            <!-- Search Section -->
            <div class="col-md-4">
                <label class="form-label">Search for order</label>
                <div class="input-box d-flex align-items-center bg-white p-2" style="border-radius: 25px;">
                    <i class='bx bx-search-alt-2 bx-flashing ms-3' style="font-size: 25px;"></i>
                    <input type="text" class="border-0" placeholder="Search" style="outline: none;" />
                </div>
            </div>
    
            <!-- Status Section -->
            <div class="col-md-4">
                <label class="form-label">Status</label>
                <select class="form-select">
                    <option>Completed</option>
                    <option>Pending</option>
                    <option>Cancelled</option>
                </select>
            </div>
    
            <!-- Payment Section -->
            <div class="col-md-4">
                <label class="form-label">Payment</label>
                <select class="form-select">
                    <option>Paid</option>
                    <option>Unpaid</option>
                </select>
            </div>
    
            <!-- Date Section -->

                    <input type="date" class="form-control" />
                </div>
            </div> -->
        </div>
    </div>
</div>
