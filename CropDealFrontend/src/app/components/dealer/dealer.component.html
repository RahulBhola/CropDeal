<div style="background-color:  rgb(180, 207, 126);">
    <div style="background: radial-gradient(circle at center,rgba(39, 75, 21, 0.95) 0%, rgba(99, 121, 55, 0.85) 50%, rgba(108, 189, 53, 0.8) 100%); height: 200px; border-radius: 0 0 50px 50px;">
        <div class="text-center pt-5 text-white">
            <h4>Explore Our Crops</h4>
            <h1 class="fw-bold" style="font-family: 'Roboto Slab', serif;">Shop Fresh Crops Today!</h1>
        </div>
    </div>
    <!-- Wrapper for Centering -->
    <div style="display: flex; justify-content: center;">
        <!-- Search Bar -->
        <div style="width: 50%; margin-top: -20px;">
            <input type="text" [(ngModel)]="searchText" (input)="filterCrops()" placeholder="Search crops..." style="width: 100%; padding: 15px; border-radius: 25px; border: none;">
        </div>
    </div>

    <div style="padding: 30px 150px;">
        <div *ngIf="filteredCrops.length > 0; else noCrops">
            <div *ngFor="let crop of filteredCrops" class="d-flex justify-content-between align-items-center mb-4" style="border-radius: 50px; padding: 25px 50px; background: rgba(255, 255, 255, 0.9); box-shadow: inset -5px 5px 7px rgba(0, 0, 0, 0.9);">
                <!-- Image -->
                <img class="me-3 image" [src]="'data:image/jpeg;base64,' + crop.imageData" alt="Crop Image"  />
                <!-- Content -->
                <div style="color: #2e4829;">
                    <h2 class="text-uppercase" style="color: #1b5e20; margin-bottom: 10px;">{{ crop.cropName }}</h2>
                    <div style="color: #455a64;">{{ crop.description }}</div>
                    <div style="color: #455a64; margin-top: 5px;">Quantity: {{ crop.availableQuantity }}</div>
                </div>
                <!-- Price -->
                <div class="ms-auto text-end w-50">
                    <div class="fw-bold mb-3" style="font-size: 25px; color: #2e7d32;">₹{{ crop.pricePerKg }} / Kg</div>
                    <div class="text-white px-3 py-1 fw-bold" style="background-color: green; display: inline; border-radius: 25px; cursor: pointer;" (click)="addToCart(crop)">{{ isCropInCart(crop.cropId) ? 'Added' : 'Add to Cart' }}</div>
                </div>
            </div>
        </div>
        <!-- No Crops Message -->
        <ng-template #noCrops>
            <div class="text-center">
                <h3>No crops added yet!</h3>
            </div>
        </ng-template>
    </div>  
  </div>
